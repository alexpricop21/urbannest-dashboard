<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanNest OS — Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #09090b;
            --bg-surface: #111113;
            --bg-surface-hover: #18181b;
            --bg-elevated: #1c1c20;
            --border-hairline: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --emerald: #10b981;
            --emerald-bg: rgba(16, 185, 129, 0.12);
            --amber: #f59e0b;
            --amber-bg: rgba(245, 158, 11, 0.12);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.14);
            --sky: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Top Command Bar */
        .topbar {
            height: 58px;
            border-bottom: 1px solid var(--border-hairline);
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 40;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .os-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .os-icon {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--emerald);
        }

        .breadcrumb {
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb span { color: var(--text-secondary); }

        .topbar-kpis {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .topbar-kpi b {
            color: var(--text-primary);
            font-weight: 600;
            margin-left: 4px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: var(--emerald-bg);
            border: 1px solid rgba(16, 185, 129, 0.28);
            color: #34d399;
        }

        .status-pill.offline {
            background: var(--red-bg);
            border-color: rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 8px var(--emerald);
            animation: pulseDot 2.2s infinite;
        }

        .status-pill.offline .status-dot {
            background: var(--red);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .container {
            max-width: 1460px;
            margin: 0 auto;
            padding: 22px 24px 60px;
        }

        /* Watchdog Alert Banner */
        .watchdog-banner {
            display: none;
            background: var(--red-bg);
            border: 1px solid rgba(239, 68, 68, 0.45);
            border-left: 4px solid var(--red);
            color: #fecaca;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            align-items: center;
            gap: 12px;
        }
        .watchdog-banner.visible { display: flex; }

        /* 5 Agents Telemetry Row */
        .agents-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .agent-tile {
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: 12px;
            padding: 15px 16px;
            transition: border-color 0.2s ease, background 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .agent-tile:hover {
            border-color: var(--border-strong);
            background: var(--bg-surface-hover);
        }

        .agent-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .agent-id-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .agent-icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-hairline);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .agent-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .agent-substatus {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            padding: 1px 7px;
            border-radius: 5px;
            background: var(--emerald-bg);
            color: #34d399;
            margin-top: 2px;
        }

        .agent-substatus.err {
            background: var(--red-bg);
            color: #f87171;
        }

        .agent-led {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            flex-shrink: 0;
            margin-top: 4px;
        }
        .agent-led.err { background: var(--red); }

        .sparkline {
            width: 100%;
            height: 26px;
            margin: 4px 0 10px;
            opacity: 0.85;
        }

        .agent-stats {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid var(--border-hairline);
            padding-top: 10px;
            gap: 8px;
        }

        .stat-block .val {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            display: block;
            line-height: 1.2;
        }

        .stat-block .lbl {
            font-size: 11px;
            color: var(--text-secondary);
            display: block;
            margin-top: 2px;
        }

        /* Main Master-Detail Split */
        .main-split {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 16px;
            align-items: start;
        }

        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: 12px;
            padding: 18px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-hairline);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            background: var(--bg-canvas);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border-hairline);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover { color: var(--text-primary); }

        .tab-btn.active {
            background: var(--bg-elevated);
            color: var(--text-primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        .tab-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            background: rgba(255,255,255,0.07);
            padding: 1px 5px;
            border-radius: 4px;
            color: var(--text-secondary);
        }

        /* Apartments Matrix */
        .apt-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
            gap: 10px;
        }

        .apt-item {
            background: var(--bg-canvas);
            border: 1px solid var(--border-hairline);
            border-left: 3px solid var(--text-muted);
            border-radius: 9px;
            padding: 13px 14px;
            transition: border-color 0.15s ease, background 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .apt-item:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-strong);
        }

        .apt-item.is-active {
            border-left-color: var(--emerald);
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.05) 0%, var(--bg-canvas) 45%);
        }

        .apt-item.is-turnover {
            border-left-color: var(--amber);
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.06) 0%, var(--bg-canvas) 45%);
        }

        .apt-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .apt-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .apt-guest {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .apt-guest.highlight { color: #fbbf24; font-weight: 500; }

        .apt-time-tag {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            padding: 2px 6px;
            border-radius: 5px;
            white-space: nowrap;
        }

        .apt-action {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.35;
        }

        .apt-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-hairline);
            padding-top: 8px;
        }

        .apt-meta b { color: var(--text-secondary); font-weight: 600; }

        /* Right Live Stream Sidebar */
        .stream-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stream-item {
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-hairline);
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .stream-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .stream-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
            background: var(--emerald);
        }
        .stream-dot.warning { background: var(--amber); }
        .stream-dot.info { background: var(--sky); }

        .stream-body { flex: 1; min-width: 0; }

        .stream-head {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .stream-time {
            color: var(--text-muted);
            font-weight: 500;
        }

        .stream-desc {
            font-size: 12px;
            color: var(--text-secondary);
            word-break: break-word;
            line-height: 1.4;
        }

        /* Tech Console Drawer */
        details.console-drawer {
            margin-top: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: 10px;
            padding: 12px 16px;
        }

        details.console-drawer summary {
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            user-select: none;
        }

        details.console-drawer pre {
            margin-top: 10px;
            background: #050507;
            border: 1px solid var(--border-hairline);
            color: #a1a1aa;
            padding: 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            max-height: 240px;
            overflow: auto;
        }

        @media (max-width: 1180px) {
            .agents-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .main-split { grid-template-columns: 1fr; }
        }

        @media (max-width: 720px) {
            .agents-row { grid-template-columns: 1fr; }
            .topbar-kpis { display: none; }
            .breadcrumb { display: none; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand-left">
            <div class="os-badge">
                <div class="os-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                UrbanNest OS
            </div>
            <div class="breadcrumb">/ <span>Command Center</span></div>
        </div>

        <div class="topbar-kpis">
            <div class="topbar-kpi">Proprietăți <b class="mono" id="kpiApts">13</b></div>
            <div class="topbar-kpi">Timp economisit azi <b class="mono" id="kpiTimeSaved">-</b></div>
            <div class="topbar-kpi">Discuții azi <b class="mono" id="kpiConvs">-</b></div>
            <div class="topbar-kpi">Acțiuni azi <b class="mono" id="kpiActions">-</b></div>
        </div>

        <div class="status-pill" id="livePill">
            <span class="status-dot"></span>
            <span id="liveStatusText">Syncing...</span>
        </div>
    </header>

    <main class="container">
        <div id="watchdogBanner" class="watchdog-banner">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <div id="watchdogBannerText"></div>
        </div>

        <!-- 5 Agents Telemetry Strip -->
        <section class="agents-row" id="coreAgentsGrid"></section>

        <!-- Master-Detail Split -->
        <div class="main-split">
            <section class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        Apartamente & Status Operațional
                    </div>
                    <div class="filter-tabs">
                        <button class="tab-btn active" data-filter="all" onclick="setFilter('all', this)">Toate <span class="tab-count" id="cntAll">13</span></button>
                        <button class="tab-btn" data-filter="active" onclick="setFilter('active', this)">Active azi <span class="tab-count" id="cntActive">0</span></button>
                        <button class="tab-btn" data-filter="turnover" onclick="setFilter('turnover', this)">Check-in/out <span class="tab-count" id="cntTurn">0</span></button>
                    </div>
                </div>
                <div class="apt-matrix" id="apartmentsGrid"></div>
            </section>

            <aside class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                        Activitate Recentă
                    </div>
                </div>
                <div class="stream-list" id="friendlyFeed"></div>
            </aside>
        </div>

        <details class="console-drawer">
            <summary>Consolă tehnică & loguri brute server</summary>
            <pre id="rawLogs">Se încarcă...</pre>
        </details>
    </main>

    <script>
        let currentFilter = 'all';
        let cachedApartments = [];

        const agentSvgs = {
            pms: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
            ai: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M6 10v2a6 6 0 0 0 12 0v-2"/><line x1="12" y1="18" x2="12" y2="22"/></svg>',
            clean: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
            reviews: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
            wa: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
        };

        const sparkPaths = {
            pms: 'M0 20 L20 18 L40 19 L60 12 L80 14 L100 8 L120 11 L140 5',
            ai: 'M0 22 L20 19 L40 14 L60 16 L80 9 L100 11 L120 4 L140 6',
            clean: 'M0 21 L20 21 L40 15 L60 15 L80 10 L100 18 L120 12 L140 9',
            reviews: 'M0 22 L30 22 L60 20 L90 14 L110 8 L140 6',
            wa: 'M0 19 L25 16 L50 18 L75 11 L100 13 L125 7 L140 5'
        };

        const shortNames = {
            pms: '5Star PMS',
            ai: 'Gemini Concierge',
            clean: 'Clean Sync',
            reviews: 'Airbnb 5★',
            wa: 'WA Courier'
        };

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderApartments();
        }

        function renderApartments() {
            let list = cachedApartments;
            if (currentFilter === 'active') {
                list = cachedApartments.filter(a => a.status === 'working' || (a.tasks_today || 0) > 0);
            } else if (currentFilter === 'turnover') {
                list = cachedApartments.filter(a => (a.guest || '').toLowerCase().includes('check-'));
            }

            if (list.length === 0) {
                document.getElementById('apartmentsGrid').innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:12px;">Niciun apartament în această categorie momentan.</div>';
                return;
            }

            const html = list.map(apt => {
                const isTurn = (apt.guest || '').toLowerCase().includes('check-');
                const isAct = apt.status === 'working' || (apt.tasks_today || 0) > 0;
                const cardClass = isTurn ? 'is-turnover' : (isAct ? 'is-active' : '');
                const realTasks = apt.tasks_today || 0;
                const realMins = realTasks * 3;

                return `
                    <div class="apt-item ${cardClass}">
                        <div>
                            <div class="apt-top">
                                <div>
                                    <div class="apt-title">${apt.name}</div>
                                    <div class="apt-guest ${isTurn ? 'highlight' : ''}">${apt.guest}</div>
                                </div>
                                <span class="apt-time-tag mono">${apt.last_time}</span>
                            </div>
                            <div class="apt-action" style="margin-top:8px;">${apt.last_action}</div>
                        </div>
                        <div class="apt-meta">
                            <span>Sarcini azi: <b class="mono">${realTasks}</b></span>
                            <span>Economisit: <b class="mono">${realMins}m</b></span>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('apartmentsGrid').innerHTML = html;
        }

        async function refreshDashboard() {
            try {
                const res = await fetch('./stats.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                const pill = document.getElementById('livePill');
                const statusTxt = document.getElementById('liveStatusText');
                const banner = document.getElementById('watchdogBanner');
                const bannerText = document.getElementById('watchdogBannerText');
                let alerteActive = [];

                if (data.watchdog_status && data.watchdog_status.healthy === false) {
                    alerteActive = alerteActive.concat(data.watchdog_status.alerts || []);
                }

                if (data.last_cloud_sync) {
                    const syncTime = new Date(data.last_cloud_sync.replace(' ', 'T'));
                    const diffMin = Math.floor((Date.now() - syncTime.getTime()) / 60000);
                    if (!isNaN(diffMin) && diffMin > 20) {
                        alerteActive.push('Laptopul nu a mai trimis date de ' + diffMin + ' min (ultimul sync: ' + data.last_cloud_sync + ').');
                    }
                }

                if (alerteActive.length > 0) {
                    pill.classList.add('offline');
                    statusTxt.innerText = 'Alertă • ' + data.updated_at;
                    banner.classList.add('visible');
                    bannerText.innerHTML = '<strong>Watchdog Alert:</strong> ' + alerteActive.join(' • ');
                } else {
                    pill.classList.remove('offline');
                    statusTxt.innerText = 'Connected • ' + data.updated_at;
                    banner.classList.remove('visible');
                }

                document.getElementById('kpiApts').innerText = data.summary.apartments_count;
                document.getElementById('kpiTimeSaved').innerText = data.summary.time_saved_str;
                document.getElementById('kpiConvs').innerText = data.summary.conversations_monitored;
                document.getElementById('kpiActions').innerText = data.summary.actions_today;

                const coreHtml = data.core_agents.map(bot => {
                    const isErr = bot.state === 'error';
                    const title = shortNames[bot.id] || bot.name;
                    const svg = agentSvgs[bot.id] || agentSvgs.pms;
                    const path = sparkPaths[bot.id] || sparkPaths.pms;
                    const strokeColor = isErr ? '#ef4444' : '#10b981';

                    const leftParts = String(bot.worked_today || '').split(' ');
                    const leftVal = leftParts[0] || '-';
                    const leftLbl = leftParts.slice(1).join(' ') || 'azi';

                    const rightParts = String(bot.metric_value || '').split(' ');
                    const rightVal = rightParts[0] || '-';
                    const rightLbl = rightParts.slice(1).join(' ') || bot.metric_label;

                    return `
                        <div class="agent-tile">
                            <div>
                                <div class="agent-head">
                                    <div class="agent-id-wrap">
                                        <div class="agent-icon-box">${svg}</div>
                                        <div style="min-width:0;">
                                            <div class="agent-name">${title}</div>
                                            <span class="agent-substatus ${isErr ? 'err' : ''}">${bot.status}</span>
                                        </div>
                                    </div>
                                    <span class="agent-led ${isErr ? 'err' : ''}"></span>
                                </div>
                                <svg class="sparkline" viewBox="0 0 140 26" preserveAspectRatio="none">
                                    <path d="${path}" fill="none" stroke="${strokeColor}" stroke-width="1.6" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <div class="agent-stats">
                                <div class="stat-block">
                                    <span class="val mono">${leftVal}</span>
                                    <span class="lbl">${leftLbl}</span>
                                </div>
                                <div class="stat-block" style="text-align:right;">
                                    <span class="val mono">${rightVal}</span>
                                    <span class="lbl">${rightLbl}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('coreAgentsGrid').innerHTML = coreHtml;

                cachedApartments = data.apartments || [];
                document.getElementById('cntAll').innerText = cachedApartments.length;
                document.getElementById('cntActive').innerText = cachedApartments.filter(a => a.status === 'working' || (a.tasks_today || 0) > 0).length;
                document.getElementById('cntTurn').innerText = cachedApartments.filter(a => (a.guest || '').toLowerCase().includes('check-')).length;
                renderApartments();

                const feedHtml = (data.feed || []).map(item => `
                    <div class="stream-item">
                        <span class="stream-dot ${item.type || ''}"></span>
                        <div class="stream-body">
                            <div class="stream-head">
                                <span class="stream-time mono">${item.time}</span>
                                <span>— ${item.title}</span>
                            </div>
                            <div class="stream-desc">${item.desc}</div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('friendlyFeed').innerHTML = feedHtml;

                document.getElementById('rawLogs').innerText = data.raw_logs;
            } catch (err) {
                console.error(err);
                document.getElementById('liveStatusText').innerText = 'Sync Error';
            }
        }

        refreshDashboard();
        setInterval(refreshDashboard, 15000);
    </script>
</body>
</html>
